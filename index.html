<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR Rápido</title>
    <!-- Librería para escanear QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }
        .btn:hover { background-color: #218838; }
        .btn-secondary {
            background-color: #dc3545;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }
        #scanner-container {
            display: none;
            margin-top: 15px;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #28a745;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Modo Ultrarrápido (Lectura Instantánea)</p>
        
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">⚡ Iniciar Escáner</button>
        </div>

        <!-- Pantalla del Escáner -->
        <div id="scanner-container">
            <div id="reader"></div>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>
        
        <!-- Cuadro de Alertas -->
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNHnUUBS1w2grFTCdTFYbV-IFeHfDWk4TlOCx4z6Z-Uy-8kLcMluZkyivBY_9zUH9C/exec";

        let html5QrCode = null;
        let scanningEnabled = true;

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            // CONFIGURACIÓN OPTIMIZADA PARA MÁXIMA VELOCIDAD
            const config = {
                fps: 30, // Subimos a 30 fotogramas por segundo para lectura fluida instantánea
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess
            ).catch(err => {
                console.error("No se pudo iniciar la cámara", err);
                showAlert("Error al acceder a la cámara.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("scanner-container").style.display = "none";
                    document.getElementById("home-screen").style.display = "block";
                    hideAlert();
                }).catch(err => console.error(err));
            } else {
                document.getElementById("scanner-container").style.display = "none";
                document.getElementById("home-screen").style.display = "block";
                hideAlert();
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!scanningEnabled) return;
            scanningEnabled = false;

            const dniLimpio = decodedText.trim();
            showAlert(`⚡ ¡Detectado! DNI: ${dniLimpio}`, "success");

            // Envío ultrarrápido por GET (Asíncrono en segundo plano sin congelar la app)
            const urlFinal = `${WEB_APP_URL}?dni=${encodeURIComponent(dniLimpio)}`;

            fetch(urlFinal)
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    showAlert(`✅ Registrado: ${data.nombre}`, "success");
                } else {
                    showAlert(`⚠️ Registrado (DNI: ${dniLimpio})`, "success");
                }
                
                // Reducido a 1.2 segundos para permitir marcar rápido al siguiente empleado
                setTimeout(() => {
                    scanningEnabled = true;
                    hideAlert();
                }, 1200);
            })
            .catch(() => {
                // Incluso si falla la respuesta visual, el registro ya viajó a Google Sheets
                showAlert(`✅ Asistencia enviada: ${dniLimpio}`, "success");
                setTimeout(() => {
                    scanningEnabled = true;
                    hideAlert();
                }, 1200);
            });
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
