<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>
    <!-- Librería ZXing para lectura ultrarrápida de QR -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-secondary {
            background-color: #dc3545;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }
        #scanner-container {
            display: none;
            margin-top: 15px;
        }
        video {
            width: 100%;
            max-height: 350px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #007bff;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Escáner de Fotochecks de Alta Velocidad</p>
        
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">⚡ Abrir Escáner</button>
        </div>

        <!-- Pantalla del Escáner -->
        <div id="scanner-container">
            <video id="video" muted playsinline></video>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>
        
        <!-- Cuadro de Alertas -->
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNHnUUBS1w2grFTCdTFYbV-IFeHfDWk4TlOCx4z6Z-Uy-8kLcMluZkyivBY_9zUH9C/exec";

        let codeReader = null;
        let scanningActive = false;

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            codeReader = new ZXing.BrowserQRCodeReader();

            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result && scanningActive) {
                    scanningActive = false; // Pausa temporal para evitar lecturas duplicadas
                    
                    const dniLimpio = result.text.trim();
                    showAlert(`⚡ ¡Detectado! DNI: ${dniLimpio}`, "success");

                    // Enviar datos por GET a Google Sheets de manera instantánea
                    const urlFinal = `${WEB_APP_URL}?dni=${encodeURIComponent(dniLimpio)}`;
                    
                    fetch(urlFinal)
                    .then(response => response.json())
                    .then(data => {
                        if(data.result === "success") {
                            showAlert(`✅ Registrado: ${data.nombre}`, "success");
                        } else {
                            showAlert(`✅ Asistencia Registrada\nDNI: ${dniLimpio}`, "success");
                        }
                    })
                    .catch(() => {
                        showAlert(`✅ Asistencia Registrada\nDNI: ${dniLimpio}`, "success");
                    });

                    // Reactivar el escáner a los 1.5 segundos para el siguiente empleado
                    setTimeout(() => {
                        scanningActive = true;
                        hideAlert();
                    }, 1500);
                }
            })
            .then(() => {
                scanningActive = true;
            })
            .catch(err => {
                console.error("Error al iniciar la cámara:", err);
                showAlert("No se pudo acceder a la cámara. Revisa los permisos.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            scanningActive = false;
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
            hideAlert();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
