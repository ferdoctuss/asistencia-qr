<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa la Manzana - Juego Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: rgba(0, 0, 0, 0.3);
            border: 4px solid #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #basket {
            position: absolute;
            bottom: 20px;
            left: 150px;
            width: 100px;
            height: 25px;
            background: #ffcc00;
            border-radius: 10px;
            border: 2px solid #e6b800;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .apple {
            position: absolute;
            top: -30px;
            width: 30px;
            height: 30px;
            background: #ff4d4d;
            border-radius: 50%;
            border: 2px solid #cc0000;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.2);
        }
        .apple::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 12px;
            width: 4px;
            height: 8px;
            background: #8b4513;
            border-radius: 2px;
        }
        #scoreboard {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: #28a745;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background: #218838;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        #instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #ddd;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h1>Atrapa la Manzana</h1>
    
    <div id="scoreboard">
        <span id="score-text">Puntuación: 0</span>
        <span id="lives-text">Vidas: 3</span>
    </div>

    <div id="game-container">
        <div id="basket"></div>
        
        <div id="start-screen">
            <h2 id="game-title" style="margin-bottom: 20px;">¡Listos para jugar!</h2>
            <button id="start-btn" onclick="startGame()">Iniciar Juego</button>
            <div id="instructions">
                Usa las <b>flechas del teclado (← →)</b> o desliza el dedo en la pantalla táctil para mover la canasta. ¡No dejes caer las manzanas!
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const scoreText = document.getElementById('score-text');
        const livesText = document.getElementById('lives-text');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameTitle = document.getElementById('game-title');

        let score = 0;
        let lives = 3;
        let gameInterval;
        let appleInterval;
        let apples = [];
        let basketX = 150;
        const basketSpeed = 25;
        let isPlaying = false;

        // Control de teclado
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Control táctil para celulares
        gameContainer.addEventListener('touchmove', (e) => {
            let touchX = e.touches[0].clientX - gameContainer.getBoundingClientRect().left;
            basketX = touchX - 50;
            if (basketX < 0) basketX = 0;
            if (basketX > 300) basketX = 300;
            basket.style.left = basketX + 'px';
        });

        function startGame() {
            startScreen.style.display = 'none';
            score = 0;
            lives = 3;
            updateUI();
            
            // Limpiar manzanas viejas si las hay
            document.querySelectorAll('.apple').forEach(a => a.remove());
            apples = [];

            isPlaying = true;
            gameInterval = setInterval(updateGame, 20);
            appleInterval = setInterval(createApple, 1000);
        }

        function createApple() {
            if (!isPlaying) return;
            const apple = document.createElement('div');
            apple.classList.add('apple');
            let posX = Math.random() * 370; // Ancho contenedor (400) - Ancho manzana (30)
            apple.style.left = posX + 'px';
            apple.style.top = '-30px';
            
            gameContainer.appendChild(apple);
            apples.push({ element: apple, x: posX, y: -30, speed: 3 + Math.random() * 3 });
        }

        function updateGame() {
            // Movimiento de la canasta por teclado
            if (keys['ArrowLeft'] && basketX > 0) {
                basketX -= basketSpeed;
            }
            if (keys['ArrowRight'] && basketX < 300) {
                basketX += basketSpeed;
            }
            basket.style.left = basketX + 'px';

            // Actualizar posición de las manzanas
            for (let i = apples.length - 1; i >= 0; i--) {
                let a = apples[i];
                a.y += a.speed;
                a.element.style.top = a.y + 'px';

                // Colisión con la canasta
                if (
                    a.y >= 535 && a.y <= 560 &&
                    a.x + 30 >= basketX && a.x <= basketX + 100
                ) {
                    a.element.remove();
                    apples.splice(i, 1);
                    score += 10;
                    updateUI();
                } 
                // Manzana caída al suelo
                else if (a.y > 570) {
                    a.element.remove();
                    apples.splice(i, 1);
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function updateUI() {
            scoreText.innerText = `Puntuación: ${score}`;
            livesText.innerText = `Vidas: ${lives}`;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(appleInterval);
            
            gameTitle.innerText = `¡Juego Terminado!\nPuntuación final: ${score}`;
            startBtn.innerText = 'Jugar de Nuevo';
            startScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
