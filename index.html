<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>
    <!-- Librería para escanear QR mediante la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            margin-top: 15px;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        #scanner-container {
            display: none;
            margin-top: 20px;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #007bff;
        }
        .alert {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Sistema de registro mediante código QR de fotochecks</p>
        
        <!-- Pantalla de Inicio / Menú Principal -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">📸 Tomar Asistencia</button>
        </div>

        <!-- Pantalla del Escáner (Oculta al inicio) -->
        <div id="scanner-container">
            <div id="reader"></div>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>
        
        <!-- Cuadro de Alertas y Resultados -->
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        // URL exacta de tu Webhook en Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNHnUUBS1w2grFTCdTFYbV-IFeHfDWk4TlOCx4z6Z-Uy-8kLcMluZkyivBY_9zUH9C/exec";

        let html5QrCode = null;
        let scanningEnabled = true;

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, // Cámara trasera del celular
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess
            ).catch(err => {
                console.error("No se pudo iniciar la cámara", err);
                showAlert("No se pudo acceder a la cámara. Revisa los permisos del navegador.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("scanner-container").style.display = "none";
                    document.getElementById("home-screen").style.display = "block";
                    hideAlert();
                }).catch(err => {
                    console.error("Error al detener el escáner.", err);
                });
            } else {
                document.getElementById("scanner-container").style.display = "none";
                document.getElementById("home-screen").style.display = "block";
                hideAlert();
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!scanningEnabled) return;
            scanningEnabled = false;

            const dniLimpio = decodedText.trim();
            showAlert(`Registrando DNI: ${dniLimpio}...`, "success");

            // Método GET enviando el DNI como parámetro en la URL
            const urlFinal = `${WEB_APP_URL}?dni=${encodeURIComponent(dniLimpio)}`;

            fetch(urlFinal)
            .then(response => response.json())
            .then(data => {
                if(data.result === "success") {
                    showAlert(`¡Asistencia Registrada!\nEmpleado: ${data.nombre}`, "success");
                } else {
                    showAlert(`Registrado (DNI no en lista):\n${dniLimpio}`, "success");
                }
                
                setTimeout(() => {
                    detenerEscanner();
                    scanningEnabled = true;
                }, 3000);
            })
            .catch(error => {
                console.error("Error:", error);
                // Si la petición llegó pero hubo problemas con el formato JSON, igual forzamos el aviso
                showAlert(`¡Marcación enviada!\nDNI: ${dniLimpio}`, "success");
                setTimeout(() => {
                    detenerEscanner();
                    scanningEnabled = true;
                }, 3000);
            });
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
