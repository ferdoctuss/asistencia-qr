<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        .alert {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-weight: bold;
            font-size: 16px;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Escanea el fotocheck (DNI del empleado)</p>
        
        <div id="reader"></div>
        
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        // Pega aquí tu URL de Google Apps Script
        const WEB_APP_URL = "PEGAR_AQUI_TU_URL_DE_APPS_SCRIPT";

        let scanningEnabled = true;

        function onScanSuccess(decodedText, decodedResult) {
            if (!scanningEnabled) return;
            scanningEnabled = false;

            showAlert("Registrando asistencia...", "success");

            // Limpiamos el texto por si el QR trae espacios
            const dniLimpio = decodedText.trim();

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ dni: dniLimpio })
            })
            .then(() => {
                showAlert(`¡Asistencia registrada!\nDNI: ${dniLimpio}`, "success");
                
                setTimeout(() => {
                    scanningEnabled = true;
                    hideAlert();
                }, 3500);
            })
            .catch(error => {
                console.error("Error:", error);
                showAlert("Error al registrar. Intente nuevamente.", "error");
                scanningEnabled = true;
            });
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            onScanSuccess
        ).catch(err => {
            console.error("No se pudo iniciar la cámara", err);
            showAlert("No se pudo acceder a la cámara. Revisa los permisos.", "error");
        });
    </script>
</body>
</html>
