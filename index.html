<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>
    <!-- Librería ZXing para lectura ultrarrápida de QR -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-secondary {
            background-color: #dc3545;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }
        .btn-reload {
            background-color: #6c757d;
            padding: 12px;
            font-size: 16px;
        }
        .btn-reload:hover { background-color: #5a6268; }
        
        #scanner-container {
            display: none;
            margin-top: 15px;
        }
        video {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #007bff;
            margin-bottom: 10px;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Sincronización Cloud (Rápida y Segura)</p>
        
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">⚡ Iniciar Escáner</button>
            <button class="btn btn-reload" onclick="location.reload()">🔄 Recargar Página</button>
        </div>

        <!-- Pantalla del Escáner -->
        <div id="scanner-container">
            <video id="video" muted playsinline></video>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>
        
        <!-- Cuadro de Alertas -->
        <div id="alertBox" class="alert"></div>

        <!-- Iframe oculto para eludir bloqueos CORS del navegador móvil -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    </div>

    <script>
        // Tu URL final de Google Apps Script ya validada
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxBiAQFpY8hz6bxEgOkKjXtehEgwzEtv-7TunbzO2P29YnwwBujOFgZwfSxnyJxyhhU/exec";

        let codeReader = null;
        let scanningActive = false;

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            codeReader = new ZXing.BrowserQRCodeReader();

            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result && scanningActive) {
                    scanningActive = false; 
                    
                    const dniLimpio = result.text.trim();
                    showAlert(`⚡ Registrando DNI: ${dniLimpio}...`, "success");

                    // Método de envío invisible mediante formulario para evitar congelamientos en iOS/Android
                    const form = document.createElement("form");
                    form.method = "GET";
                    form.action = WEB_APP_URL;
                    form.target = "hidden_iframe";

                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = "dni";
                    input.value = dniLimpio;

                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);

                    setTimeout(() => {
                        showAlert(`✅ ¡Asistencia Registrada!\nDNI: ${dniLimpio}`, "success");
                    }, 500);

                    // Reactivar el escáner a los 1.5 segundos para el siguiente pase
                    setTimeout(() => {
                        scanningActive = true;
                        hideAlert();
                    }, 1500);
                }
            })
            .then(() => {
                scanningActive = true;
            })
            .catch(err => {
                console.error("Error cámara:", err);
                showAlert("Permisos de cámara denegados.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            scanningActive = false;
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
            hideAlert();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
