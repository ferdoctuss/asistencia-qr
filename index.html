<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia QR</title>
    <!-- Librería ZXing para lectura ultrarrápida de QR -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-secondary {
            background-color: #dc3545;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }
        .btn-database {
            background-color: #28a745;
            padding: 14px;
            font-size: 16px;
        }
        .btn-database:hover { background-color: #218838; }
        .btn-reload {
            background-color: #6c757d;
            padding: 12px;
            font-size: 16px;
        }
        .btn-reload:hover { background-color: #5a6268; }
        
        #scanner-container, #database-screen {
            display: none;
            margin-top: 15px;
        }
        video {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #007bff;
            margin-bottom: 10px;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Estilos del historial local */
        .history-container {
            margin-top: 25px;
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
        }
        .history-title {
            font-size: 15px;
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-name {
            font-weight: bold;
            color: #222;
        }
        .history-time {
            color: #888;
            font-size: 12px;
            white-space: nowrap;
            margin-left: 10px;
        }
        .btn-clear {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Contenedor del Iframe de Google Sheets */
        .iframe-wrapper {
            width: 100%;
            height: 60vh;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
            margin-bottom: 15px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        
        <!-- Pantalla Principal -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">⚡ Iniciar Escáner</button>
            <button class="btn btn-database" onclick="mostrarBaseDatos()">📊 Ver Base de Datos</button>

            <!-- Historial Rápido -->
            <div class="history-container">
                <div class="history-title">
                    ⏱️ Últimos Escaneos
                    <button class="btn-clear" onclick="limpiarHistorial()">Borrar</button>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </div>
        </div>

        <!-- Pantalla del Escáner -->
        <div id="scanner-container">
            <video id="video" muted playsinline></video>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>

        <!-- Pantalla de la Base de Datos en Google Sheets -->
        <div id="database-screen">
            <p style="color: #dc3545; font-weight: bold; font-size: 15px; margin-bottom: 10px;">
                Recarga la página para ver los últimos registros
            </p>
            <button class="btn btn-reload" style="margin-bottom: 20px;" onclick="location.reload()">🔄 Recargar Página</button>

            <div class="iframe-wrapper">
                <iframe src="https://docs.google.com/spreadsheets/d/18MHyH8JnecfC4i4ih0PRfffTR0DkRQWdKxaky9ziUw0/htmlembed?gid=0&widget=false&chrome=false" title="Base de Datos Asistencia"></iframe>
            </div>
            <button class="btn btn-secondary" onclick="ocultarBaseDatos()">Volver al Inicio</button>
        </div>
        
        <!-- Cuadro de Alertas -->
        <div id="alertBox" class="alert"></div>

        <!-- Iframe oculto (Pilar EURECA INTACTO) -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxBiAQFpY8hz6bxEgOkKjXtehEgwzEtv-7TunbzO2P29YnwwBujOFgZwfSxnyJxyhhU/exec";
        
        // Diccionario local de empleados para mostrar nombres sin tocar EURECA
        let empleadosMap = {};

        let codeReader = null;
        let scanningActive = false;

        window.onload = function() {
            cargarHistorial();
            descargarListaEmpleados(); // Carga los nombres en segundo plano
        };

        // Función que lee la pestaña EMPLEADOS directamente de forma segura
        function descargarListaEmpleados() {
            // URL de exportación CSV directa a tu pestaña EMPLEADOS (gid=1678483593)
            const csvUrl = "https://docs.google.com/spreadsheets/export?format=csv&id=18MHyH8JnecfC4i4ih0PRfffTR0DkRQWdKxaky9ziUw0&gid=1678483593";
            
            fetch(csvUrl)
                .then(response => response.text())
                .then(data => {
                    const lineas = data.split('\n');
                    for(let i = 1; i < lineas.length; i++) {
                        const columnas = lineas[i].split(',');
                        if(columnas.length >= 2) {
                            const dni = columnas[0].replace(/["\r]/g, '').trim();
                            const nombre = columnas[1].replace(/["\r]/g, '').trim();
                            if(dni) empleadosMap[dni] = nombre;
                        }
                    }
                })
                .catch(err => console.log("Se usará el DNI temporalmente (sin red/bloqueo)."));
        }

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            codeReader = new ZXing.BrowserQRCodeReader();

            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result && scanningActive) {
                    scanningActive = false; 
                    
                    const dniLimpio = result.text.trim();
                    
                    // Buscar el nombre en el diccionario, si no lo encuentra, usa el DNI temporalmente
                    const nombreMostrar = empleadosMap[dniLimpio] || dniLimpio;
                    
                    showAlert(`⚡ Registrando: ${nombreMostrar}...`, "success");

                    // Guardar en el historial visual usando el NOMBRE
                    agregarAHistorial(dniLimpio, nombreMostrar);

                    // Envío a Google Sheets (EURECA INTACTO)
                    const form = document.createElement("form");
                    form.method = "GET";
                    form.action = WEB_APP_URL;
                    form.target = "hidden_iframe";

                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = "dni";
                    input.value = dniLimpio;

                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);

                    setTimeout(() => {
                        showAlert(`✅ ¡Asistencia Registrada!\n${nombreMostrar}`, "success");
                    }, 500);

                    setTimeout(() => {
                        scanningActive = true;
                        hideAlert();
                    }, 1500);
                }
            })
            .then(() => {
                scanningActive = true;
            })
            .catch(err => {
                console.error("Error cámara:", err);
                showAlert("Permisos de cámara denegados.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            scanningActive = false;
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
            hideAlert();
        }

        function mostrarBaseDatos() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("database-screen").style.display = "block";
        }

        function ocultarBaseDatos() {
            document.getElementById("database-screen").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
        }

        /* --- Funciones de Historial Local Actualizadas para Nombres --- */
        function cargarHistorial() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = ''; 
            
            let historial = JSON.parse(localStorage.getItem('historial_qr_asistencia')) || [];
            
            if (historial.length === 0) {
                historyList.innerHTML = '<li class="history-item" style="color:#999; justify-content:center;">No hay escaneos recientes</li>';
                return;
            }

            historial.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                // Si el item tiene nombre guardado lo usa, si es antiguo usa el DNI
                const textoMostrar = item.nombre || item.dni; 
                li.innerHTML = `<span class="history-name">${textoMostrar}</span> <span class="history-time">${item.hora}</span>`;
                historyList.appendChild(li);
            });
        }

        function agregarAHistorial(dni, nombre) {
            let historial = JSON.parse(localStorage.getItem('historial_qr_asistencia')) || [];
            const ahora = new Date();
            const horaStr = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            // Guardamos tanto el DNI como el Nombre
            historial.unshift({ dni: dni, nombre: nombre, hora: horaStr }); 
            if(historial.length > 15) historial.pop();
            
            localStorage.setItem('historial_qr_asistencia', JSON.stringify(historial));
            cargarHistorial();
        }

        function limpiarHistorial() {
            if(confirm("¿Borrar el historial local? (La base de datos de Google no se borrará)")) {
                localStorage.removeItem('historial_qr_asistencia');
                cargarHistorial();
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
