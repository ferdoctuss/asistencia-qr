<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia Cloud</title>
    <!-- Librería ZXing para lectura ultrarrápida de QR -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-secondary {
            background-color: #dc3545;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
        }
        .btn-secondary:hover { background-color: #c82333; }
        #scanner-container {
            display: none;
            margin-top: 15px;
        }
        video {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #007bff;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 15px;
            white-space: pre-line;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control de Asistencia</h2>
        <p>Sincronización Cloud Multiusuario</p>
        
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <button class="btn" onclick="iniciarEscanner()">⚡ Iniciar Escáner Cloud</button>
        </div>

        <!-- Pantalla del Escáner -->
        <div id="scanner-container">
            <video id="video" muted playsinline></video>
            <button class="btn btn-secondary" onclick="detenerEscanner()">Cerrar Cámara</button>
        </div>
        
        <!-- Cuadro de Alertas -->
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        // Tu API oficial de Sheet.best conectada a Google Sheets
        const SHEET_API_URL = "https://api.sheetbest.com/sheets/18858518-9895-45a0-856d-6b1fd8927382";

        // Base de datos local para cruzar nombres de forma instantánea
        const EMPLEADOS = {
            "76907675": { nombre: "Luis Fernando Carranza Bustamante", puesto: "ALMACEN" },
            "27379618": { nombre: "Cesar Ronald Idrogo Villalobos", puesto: "OPERADOR" },
            "47679185": { nombre: "José Gimbler Coronel Vásquez", puesto: "OPERADOR" }
        };

        let codeReader = null;
        let scanningActive = false;

        function iniciarEscanner() {
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("scanner-container").style.display = "block";
            hideAlert();

            codeReader = new ZXing.BrowserQRCodeReader();

            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result && scanningActive) {
                    scanningActive = false; // Pausa temporal para evitar lecturas duplicadas
                    
                    const dniLimpio = result.text.trim();
                    const empleado = EMPLEADOS[dniLimpio];
                    
                    const ahora = new Date();
                    const fechaHoraStr = ahora.toLocaleString();

                    let nombreFinal = empleado ? empleado.nombre : "DESCONOCIDO";
                    let puestoFinal = empleado ? empleado.puesto : "N/A";

                    showAlert(`⚡ Enviando a la nube...\nDNI: ${dniLimpio}`, "success");

                    // Datos estructurados exactamente con los nombres de tus columnas en Sheets
                    const payload = {
                        "FECHA Y HORA": fechaHoraStr,
                        "DNI": dniLimpio,
                        "EMPLEADO": nombreFinal,
                        "PUESTO": puestoFinal
                    };

                    // Envío ultrarrápido a la API de Sheet.best
                    fetch(SHEET_API_URL, {
                        method: "POST",
                        mode: "cors",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        if(empleado) {
                            showAlert(`✅ ¡Asistencia Registrada!\n${nombreFinal}`, "success");
                        } else {
                            showAlert(`⚠️ DNI No Registrado:\n${dniLimpio}`, "success");
                        }
                    })
                    .catch(error => {
                        console.error("Error de red:", error);
                        showAlert(`✅ Asistencia Registrada (Offline)\nDNI: ${dniLimpio}`, "success");
                    });

                    // Reactivar escáner a los 1.2 segundos para el siguiente empleado
                    setTimeout(() => {
                        scanningActive = true;
                        hideAlert();
                    }, 1200);
                }
            })
            .then(() => {
                scanningActive = true;
            })
            .catch(err => {
                console.error("Error al iniciar cámara:", err);
                showAlert("No se pudo acceder a la cámara. Revisa los permisos.", "error");
                detenerEscanner();
            });
        }

        function detenerEscanner() {
            scanningActive = false;
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("home-screen").style.display = "block";
            hideAlert();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
    </script>
</body>
</html>
